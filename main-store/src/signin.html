<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Store-Login user</title>
    <link rel="icon" type="image/png" href="icons/main_store_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="awning" aria-hidden="true"></div>
    <main>
        <div class="card">
            <a class="brand" href="../index.html">Main Store</a>
            <h1>Sign in</h1>
            <p class="lead">Enter your e-mail and password to continue.</p>

            <form name="login-form" action="signin.php" method="POST">
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="example@correo.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="pswd">Password</label>
                    <input type="password" id="pswd" name="pswd" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary btn-block">Sign in</button>
            </form>

            <p class="switch">New here? <a href="signup.html">Create an account</a></p>
        </div>
    </main>
</body>
</html>
